version: '3.8'

services:
  movie-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-catalog-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CATALOG_MAX_GENRES_PER_MOVIE=5
      - CATALOG_DEFAULT_RATING=5.0
    restart: unless-stopped
